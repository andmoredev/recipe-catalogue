name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'gateway/**'
      - 'openapi.yaml'
      - 'template.yaml'
      - 'samconfig.yaml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'gateway/**'
      - 'openapi.yaml'
      - 'template.yaml'
      - 'samconfig.yaml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  PROD_API_STACK: recipe-catalog
  PROD_GATEWAY_STACK: recipe-catalog-mcp

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            API_STACK="${{ env.PROD_API_STACK }}-pr-${{ github.event.number }}"
            GATEWAY_STACK="${{ env.PROD_GATEWAY_STACK }}-pr-${{ github.event.number }}"
          else
            API_STACK="${{ env.PROD_API_STACK }}"
            GATEWAY_STACK="${{ env.PROD_GATEWAY_STACK }}"
          fi
          echo "api_stack=$API_STACK" >> $GITHUB_OUTPUT
          echo "gateway_stack=$GATEWAY_STACK" >> $GITHUB_OUTPUT
          echo "Deploying API stack: $API_STACK"
          echo "Deploying gateway stack: $GATEWAY_STACK"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy API stack
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          ROLE_ARN_FLAG=""
          if [ -n "${{ vars.CFN_EXECUTION_ROLE_ARN }}" ]; then
            ROLE_ARN_FLAG="--role-arn ${{ vars.CFN_EXECUTION_ROLE_ARN }}"
          fi
          sam build
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name ${{ steps.env.outputs.api_stack }} \
            --s3-bucket ${{ vars.ARTIFACTS_BUCKET }} \
            --capabilities CAPABILITY_IAM \
            $ROLE_ARN_FLAG

      - name: Get API stack outputs
        id: api
        run: |
          STACK_NAME="${{ steps.env.outputs.api_stack }}"
          TABLE_NAME=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='RecipesTableName'].OutputValue" --output text)
          API_URL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          echo "table_name=$TABLE_NAME" >> $GITHUB_OUTPUT
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT

      - name: Ensure vector index
        run: |
          TABLE_NAME="${{ steps.api.outputs.table_name }}"
          INDEX_NAME="RecipeEmbeddingIndex"

          echo "Checking vector index on table: $TABLE_NAME"

          TABLE_DESC=$(aws dynamodb describe-table --table-name "$TABLE_NAME" --output json)

          if echo "$TABLE_DESC" | grep -q "$INDEX_NAME"; then
            echo "✓ Vector index '$INDEX_NAME' already exists"
          else
            echo "Creating vector index '$INDEX_NAME'..."
            aws dynamodb update-table \
              --table-name "$TABLE_NAME" \
              --attribute-definitions AttributeName=cuisine,AttributeType=S \
              --vector-index-updates '[{
                "Create": {
                  "IndexName": "RecipeEmbeddingIndex",
                  "VectorAttribute": {"AttributeName": "embedding"},
                  "SearchSchema": [{"AttributeName": "cuisine", "SearchSchemaElementType": "INLINE_FILTER"}],
                  "Projection": {"ProjectionType": "ALL"},
                  "Dimensions": 1024,
                  "DistanceFunction": "COSINE"
                }
              }]'

            echo "Waiting for table to become ACTIVE..."
            aws dynamodb wait table-exists --table-name "$TABLE_NAME"
            echo "✓ Vector index created"
          fi

      - name: Deploy gateway (MCP) stack
        run: |
          ROLE_ARN_FLAG=""
          if [ -n "${{ vars.CFN_EXECUTION_ROLE_ARN }}" ]; then
            ROLE_ARN_FLAG="--role-arn ${{ vars.CFN_EXECUTION_ROLE_ARN }}"
          fi
          sam deploy \
            --template gateway/template.yaml \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name ${{ steps.env.outputs.gateway_stack }} \
            --s3-bucket ${{ vars.ARTIFACTS_BUCKET }} \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              ApiStackName=${{ steps.env.outputs.api_stack }} \
              GatewayName=${{ steps.env.outputs.gateway_stack }} \
            $ROLE_ARN_FLAG

      - name: Get gateway stack outputs
        id: gateway
        run: |
          STACK_NAME="${{ steps.env.outputs.gateway_stack }}"
          GATEWAY_URL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='GatewayUrl'].OutputValue" --output text)
          echo "gateway_url=$GATEWAY_URL" >> $GITHUB_OUTPUT

      - name: Print outputs
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Output | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| API Stack | ${{ steps.env.outputs.api_stack }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API URL | ${{ steps.api.outputs.api_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gateway Stack | ${{ steps.env.outputs.gateway_stack }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **AgentCore Gateway URL** | ${{ steps.gateway.outputs.gateway_url }} |" >> $GITHUB_STEP_SUMMARY
