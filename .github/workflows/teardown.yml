name: Teardown PR Environment

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  PROD_API_STACK: recipe-catalog
  PROD_GATEWAY_STACK: recipe-catalog-mcp

jobs:
  teardown:
    name: Teardown PR Environment
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Delete PR stacks
        run: |
          API_STACK="${{ env.PROD_API_STACK }}-pr-${{ github.event.number }}"
          GATEWAY_STACK="${{ env.PROD_GATEWAY_STACK }}-pr-${{ github.event.number }}"

          delete_stack() {
            local name="$1"
            if aws cloudformation describe-stacks --stack-name "$name" >/dev/null 2>&1; then
              echo "Deleting stack: $name"
              sam delete \
                --stack-name "$name" \
                --no-prompts \
                --s3-bucket ${{ vars.ARTIFACTS_BUCKET }} \
                --region ${{ vars.AWS_REGION }}
              echo "✓ Deleted $name"
            else
              echo "✓ Stack $name does not exist, nothing to clean up"
            fi
          }

          # Delete the gateway stack FIRST — it imports exports from the API
          # stack, and CloudFormation blocks deleting an exporting stack while
          # an importing stack still references it.
          delete_stack "$GATEWAY_STACK"
          delete_stack "$API_STACK"
