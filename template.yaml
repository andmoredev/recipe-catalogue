AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Recipe API with vector search: CRUD operations with inline Bedrock embeddings

Parameters:
  EmbeddingModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 30
    MemorySize: 256
    Architectures:
      - arm64
    Environment:
      Variables:
        TABLE_NAME: !Ref RecipesTable
        EMBEDDING_MODEL_ID: !Ref EmbeddingModelId

Resources:
  # --- DynamoDB Table ---
  RecipesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: recipeId
          AttributeType: S
      KeySchema:
        - AttributeName: recipeId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  # --- REST API ---
  RecipeApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Description: Recipe CRUD + Vector Search API
      Auth:
        DefaultAuthorizer: RecipeCognitoAuthorizer
        Authorizers:
          RecipeCognitoAuthorizer:
            UserPoolArn: !GetAtt RecipeUserPool.Arn
      DefinitionBody:
        Fn::Transform:
          Name: AWS::Include
          Parameters:
            Location: ./openapi.yaml

  # --- Lambda Functions ---
  CreateRecipeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      CodeUri: functions/create-recipe/
      Description: Create a recipe with inline embedding generation
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RecipesTable
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/${EmbeddingModelId}
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RecipeApi
            Path: /recipes
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Format: esm
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - index.ts
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);
        External:
          - "@aws-sdk/*"

  GetRecipeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      CodeUri: functions/get-recipe/
      Description: Get a recipe by ID
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RecipesTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RecipeApi
            Path: /recipes/{recipeId}
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Format: esm
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - index.ts
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);
        External:
          - "@aws-sdk/*"

  UpdateRecipeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      CodeUri: functions/update-recipe/
      Description: Update a recipe with inline embedding regeneration
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RecipesTable
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/${EmbeddingModelId}
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RecipeApi
            Path: /recipes/{recipeId}
            Method: PUT
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Format: esm
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - index.ts
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);
        External:
          - "@aws-sdk/*"

  DeleteRecipeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      CodeUri: functions/delete-recipe/
      Description: Delete a recipe by ID
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RecipesTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RecipeApi
            Path: /recipes/{recipeId}
            Method: DELETE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Format: esm
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - index.ts
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);
        External:
          - "@aws-sdk/*"

  SearchRecipesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      CodeUri: functions/search-recipes/
      Description: Search recipes using vector similarity (embeds query inline)
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RecipesTable
        - Statement:
            - Effect: Allow
              Action: dynamodb:*
              Resource:
                - !GetAtt RecipesTable.Arn
                - !Sub ${RecipesTable.Arn}/index/*
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/${EmbeddingModelId}
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref RecipeApi
            Path: /recipes/search
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Format: esm
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - index.ts
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);
        # NOTE: The AWS SDK is intentionally NOT marked external here. The
        # SearchVectors API is very new and is not present in the Lambda
        # runtime's built-in @aws-sdk/client-dynamodb, so we bundle the SDK
        # version (from this function's package.json) that includes it.

  # ============================================================
  # Cognito — inbound auth for the gateway + the REST API
  # ============================================================
  RecipeUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-users
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true

  RecipeUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref RecipeUserPool
      Domain: !Sub ${AWS::StackName}-${AWS::AccountId}

  RecipeResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref RecipeUserPool
      Identifier: recipe-api
      Name: Recipe API
      Scopes:
        - ScopeName: invoke
          ScopeDescription: Invoke the Recipe API

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${RecipeApi}.execute-api.${AWS::Region}.amazonaws.com/prod
  RecipesTableName:
    Description: DynamoDB table name (AWS-generated)
    Value: !Ref RecipesTable
  RecipesTableArn:
    Description: DynamoDB table ARN
    Value: !GetAtt RecipesTable.Arn
  SearchRecipesFunctionArn:
    Description: SearchRecipesFunction ARN (Lambda target)
    Value: !GetAtt SearchRecipesFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-SearchRecipesFunctionArn
  GetRecipeFunctionArn:
    Description: GetRecipeFunction ARN (Lambda target)
    Value: !GetAtt GetRecipeFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-GetRecipeFunctionArn
  UserPoolId:
    Description: Cognito user pool ID
    Value: !Ref RecipeUserPool
    Export:
      Name: !Sub ${AWS::StackName}-UserPoolId
  CognitoTokenEndpoint:
    Description: OAuth2 token endpoint for obtaining access tokens
    Value: !Sub https://${AWS::StackName}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com/oauth2/token
    Export:
      Name: !Sub ${AWS::StackName}-CognitoTokenEndpoint
